<VirtualHost *:80>
    ServerName collec.mysociety.com
    ServerPath /collec.mysociety.com
    RewriteEngine On
    RewriteRule ^ https://collec.mysociety.com%{REQUEST_URI} [R]
</VirtualHost>
<VirtualHost *:443>
    ServerName collec.mysociety.com
    ServerPath /collec.mysociety.com
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/collec_science_inrae_fr_cert.cer
    SSLCertificateKeyFile /etc/ssl/certs/cert_collec_science_inrae_fr.key
    SSLCertificateChainFile /etc/ssl/certs/certificats_chain_sectigo.cer
    setenv envPath /var/www/collec2App/collec-science
    CustomLog /var/log/apache2/collec-access.log combined
    ErrorLog /var/log/apache2/collec-error.log
    DocumentRoot /var/www/collec2App/collec-science/public

# Configuration Mellon for Renater
<location />
AuthType Mellon
MellonEnable "auth"
MellonSecureCookie On
MellonUser MAIL
MellonMergeEnvVars On
MellonSubjectConfirmationDataAddressCheck Off
MellonSPPrivateKeyFile /etc/apache2/mellon/https_collecscience.collec_science.inrae.fr.key
MellonSPCertFile /etc/apache2/mellon/https_collecscience.collec_science.inrae.fr.cert
MellonSPentityId "https://collecscience.collec-science.inrae.fr"
MellonSPMetadataFile "/etc/apache2/mellon/https_collecscience.collec_science.inrae.fr.xml"
MellonIdPMetadataFile "/etc/apache2/mellon/main-idps-renater-metadata.xml"
MellonIdPPublicKeyFile "/etc/apache2/mellon/renater-metadata-signing-cert-2016.pem"
MellonIdPCAFile "/etc/apache2/mellon/renater-metadata-signing-cert-2016.pem"
MellonProbeDiscoveryTimeout 1
MellonSetEnv "MAIL" "urn:oid:0.9.2342.19200300.100.1.3"
MellonSetEnv "GIVENNAME" "urn:oid:2.5.4.3"
MellonSetEnv "suppannentiteaffectationprincipale" "urn:oid:1.3.6.1.4.1.7135.1.2.1.13"
MellonSetEnv "suppannentiteaffectation" "urn:oid:1.3.6.1.4.1.7135.1.2.1.8"
MellonEndpointPath /mellon
MellonSetEnvNoPrefix REMOTE_USER NAME_ID
MellonDiscoveryURL "https://discovery.renater.fr/renater/WAYF"
#MellonDiscoveryURL "https://discovery.renater.fr/renater/WAYF?cru=yes"
</location>

</VirtualHost>